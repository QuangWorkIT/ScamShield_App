spring:
  profiles:
    default: dev
  application:
    name: scamshield-backend
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 80MB

  # Database Configuration (PostgreSQL)
  datasource:
    url: jdbc:postgresql://localhost:5432/scamshield-db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'Asia/Ho_Chi_Minh'

  # JPA/Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Mail Configuration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    display-name: ${MAIL_DISPLAY_NAME:ScamShield}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Server Port
server:
  port: 8080

# Firebase Phone Authentication (SMS requires Blaze/billing in Firebase).
firebase:
  phone:
    api-key: ${FIREBASE_WEB_API_KEY:}
    max-requests-per24-hours: ${SMS_OTP_MAX_REQUESTS_PER_24_HOURS:10}

# Application Configurations
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS}
